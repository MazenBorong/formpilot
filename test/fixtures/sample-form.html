<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Register as Supplier</title>
</head>
<body>
<h1>Register as Supplier</h1>

<form id="supplier-form">
  <input type="hidden" name="source" value="formpilot-sample" />

  <section class="wizard-step" data-step="1">
    <h2>Company details</h2>
    <label for="companyName">Company name</label>
    <input id="companyName" name="companyName" type="text" required maxlength="80" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" />

    <label for="state">State</label>
    <select id="state" name="state" required>
      <option value="">Select a state</option>
      <option value="SGR">Selangor</option>
      <option value="KUL">Kuala Lumpur</option>
      <option value="JHR">Johor</option>
    </select>

    <button type="button" id="next-btn">Next</button>
  </section>

  <section class="wizard-step" data-step="2" style="display:none">
    <h2>Documents & agreement</h2>
    <label for="regCert">Registration certificate (PDF)</label>
    <input id="regCert" name="regCert" type="file" accept=".pdf,application/pdf" required />

    <label>
      <input id="terms" name="terms" type="checkbox" required />
      I agree to the supplier terms and conditions
    </label>

    <button type="submit" id="submit-btn">Submit registration</button>
  </section>
</form>

<div id="result" role="alert" style="display:none"></div>

<script>
  var form = document.getElementById('supplier-form');
  var step1 = document.querySelector('[data-step="1"]');
  var step2 = document.querySelector('[data-step="2"]');

  document.getElementById('next-btn').addEventListener('click', function () {
    // Only advance once the first step's own fields are valid, like a real wizard.
    var valid = true;
    step1.querySelectorAll('input, select').forEach(function (el) {
      if (!el.checkValidity()) valid = false;
    });
    if (!valid) {
      step1.querySelectorAll('input, select').forEach(function (el) { el.reportValidity && el.reportValidity(); });
      return;
    }
    step1.style.display = 'none';
    step2.style.display = 'block';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var result = document.getElementById('result');
    result.style.display = 'block';
    result.textContent = 'Registration submitted successfully.';
    document.title = 'Registration submitted';
  });
</script>
</body>
</html>
